services:
  postgres:
    image: postgres:17.5-alpine
    container_name: tcip-postgres

    environment:
      POSTGRES_DB: identity
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: identity

    ports:
      - "5432:5432"

    volumes:
      - tcip_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    container_name: tcip-redis
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:4.2.1
    container_name: tcip-kafka
    environment:
      CLUSTER_ID: "abcdefghijklmnopqrstuv"
      KAFKA_NODE_ID: "0"
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
    ports:
      - "9092:9094"

  kafka-init:
    image: apache/kafka:4.2.1
    depends_on:
      - kafka
    restart: on-failure
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command: ["--bootstrap-server", "kafka:9092", "--create", "--if-not-exists", "--topic", "calendar.reminder-due.v1", "--partitions", "3", "--replication-factor", "1"]

volumes:
  tcip_postgres_data:
