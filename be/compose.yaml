services:
  postgres:
    image: postgres:17.5-alpine
    container_name: tcip-postgres
    environment:
      POSTGRES_DB: identity
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: identity
    ports:
      - "5432:5432"
    volumes:
      - tcip_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity -d identity"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: tcip-redis
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:4.2.1
    container_name: tcip-kafka
    environment:
      CLUSTER_ID: "abcdefghijklmnopqrstuv"
      KAFKA_NODE_ID: "0"
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
    ports:
      - "9092:9094"

  kafka-init:
    image: apache/kafka:4.2.1
    depends_on:
      - kafka
    restart: on-failure
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic calendar.reminder-due.v2 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic calendar.notification-batch.v1 --partitions 6 --replication-factor 1

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tcip-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=identity;Username=identity;Password=identity"
      Jwt__Issuer: "identity-service"
      Jwt__Audience: "identity-service"
      Jwt__Key: "super_secret_jwt_key_that_is_at_least_32_bytes_long_123456"
      Kafka__Enabled: "true"
      Kafka__BootstrapServers: "kafka:9092"
      Kafka__ReminderDueTopic: "calendar.reminder-due.v2"
      Kafka__NotificationBatchTopic: "calendar.notification-batch.v1"
      SignalR__Redis__ConnectionString: "redis:6379"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  tcip_postgres_data:
